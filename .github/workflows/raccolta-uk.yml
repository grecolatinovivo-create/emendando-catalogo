# Corsia «uk» (dal 26 ottobre 2026): biblioteche del Regno Unito e dell'Irlanda (server diversi dalle altre corsie):
# Wellcome Collection (API del catalogo), Irish Script on Screen (Royal Irish Academy, National Library of Ireland, Trinity College
# Dublin, National Library of Scotland e altre), Manchester Digital Collections (John Rylands), Cambridge Digital Library (dal server,
# con le collezioni IIIF) e Chester Beatty (un manifesto ogni 10 secondi, come chiede il robots.txt).
# Gli stati sono in data/wellcome.json, data/isos.json, data/manchester.json, data/cudl.json, data/cbl.json.
# Richieste in serie, una biblioteca dopo l'altra, con le pause di sempre (scripts/rete.mjs).
# Ruota fino a lettura completa: finché una delle cinque non ha finito la prima lettura, la corsia lavora circa 150 minuti per
# esecuzione e riparte subito da sola, purché nel giro ci siano stati progressi (scripts/ruota.mjs). Poi torna al giro notturno
# delle 04:20 UTC, che prende solo i codici nuovi.
name: "Raccolta: corsia uk"

on:
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # per la ruota

concurrency:
  group: raccolta-uk
  cancel-in-progress: false

jobs:
  corsia:
    uses: ./.github/workflows/corsia.yml
    with:
      corsia: uk
      fonti: wellcome,isos,manchester,cudl,cbl
      argomenti: --wellcome-minuti=10 --isos-minuti=20 --manchester-minuti=30 --cudl-minuti=45 --cbl-minuti=60
      cache: false
      ruota: false
      completa: true
      flusso: raccolta-uk.yml
