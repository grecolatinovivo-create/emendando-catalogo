# Corsia «medioriente» (dal 27 ottobre 2026): fonti del Vicino Oriente e del Golfo agganciate dopo il controllo di Iraq, Siria,
# Giordania, Arabia Saudita, Yemen, Oman, Emirati Arabi Uniti e Kuwait (docs/COPERTURA.md), server diversi dalle altre corsie:
#   - Iraqi Jewish Archive (fonte «ija»): API REST di Omeka S (ijarchive.org), manifesti IIIF del sito; entrano i frammenti di rotoli
#     della Torah e di Ester della comunità ebraica di Baghdad con la copia intera nelle immagini IIIF.
# Gli stati sono in data/<fonte>.json. Richieste in serie, con le pause di sempre (1,5 secondi).
# Ruota fino a lettura completa: finché una fonte della corsia non ha finito la prima lettura, la corsia lavora fino a circa
# 150 minuti per esecuzione e riparte subito da sola, purché nel giro ci siano stati progressi (scripts/ruota.mjs).
# Poi torna al giro notturno delle 04:50 UTC, che prende i codici nuovi.
name: "Raccolta: corsia medioriente"

on:
  schedule:
    - cron: "50 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # per la ruota

concurrency:
  group: raccolta-medioriente
  cancel-in-progress: false

jobs:
  corsia:
    uses: ./.github/workflows/corsia.yml
    with:
      corsia: medioriente
      fonti: ija
      argomenti: --ija-minuti=20
      cache: false
      ruota: false
      completa: true
      flusso: raccolta-medioriente.yml
