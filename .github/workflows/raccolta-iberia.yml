# Corsia «iberia» (dal 26 ottobre 2026): biblioteche della Spagna (server diversi dalle altre corsie):
# Memòria Digital de Catalunya (Biblioteca de Catalunya, Ateneu Barcelonès, Biblioteca Museu Víctor Balaguer, Biblioteca Pública
# Episcopal del Seminari de Barcelona) e Universitat de Barcelona (CONTENTdm), Real Biblioteca del Palacio Real ed El Escorial e
# Universidad Complutense (Omeka S), Universidad de Sevilla (Internet Archive), Real Academia de la Historia (DIGIBIB, manifesti
# scritti dal catalogo). Gli stati sono in data/mdc.json, data/ub.json, data/realbiblioteca.json, data/ucm.json, data/sevilla.json,
# data/rah.json. Richieste in serie, una biblioteca dopo l'altra, con le pause di sempre (scripts/rete.mjs).
# Ruota fino a lettura completa: finché una di esse non ha finito la prima lettura completa, la corsia riparte subito da sola,
# purché nel giro ci siano stati progressi (scripts/ruota.mjs). Poi torna al giro notturno delle 01:40 UTC.
name: "Raccolta: corsia iberia"

on:
  schedule:
    - cron: "40 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # per la ruota

concurrency:
  group: raccolta-iberia
  cancel-in-progress: false

jobs:
  corsia:
    uses: ./.github/workflows/corsia.yml
    with:
      corsia: iberia
      fonti: mdc,ub,realbiblioteca,ucm,sevilla,rah
      argomenti: --mdc-minuti=15 --ub-minuti=10 --realbiblioteca-minuti=20 --ucm-minuti=20 --sevilla-minuti=5 --rah-minuti=70
      cache: false
      ruota: false
      completa: true
      flusso: raccolta-iberia.yml
