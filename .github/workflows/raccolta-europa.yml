# Corsia «europa» (dal 26 ottobre 2026): biblioteche europee agganciate dopo il censimento (docs/COPERTURA.md), server diversi dalle
# altre corsie:
#   - dal Handschriftenportal (come Bamberga, Colonia e Lipsia): Universitätsbibliothek Frankfurt am Main, SLUB Dresda,
#     Universitätsbibliothek Tübingen, ULB Darmstadt (per Darmstadt si leggono anche i manifesti di TUdigit, una volta, per le copie
#     scritte dal catalogo: scripts/manifesti.mjs);
#   - handrit.is (Reykjavík e Copenaghen): nessuna richiesta al sito, si leggono le descrizioni TEI dal repository GitHub del progetto
#     (clone ogni 14 giorni); i manifesti li scrive il catalogo;
#   - Polona (Biblioteka Narodowa e altre biblioteche polacche) e Manuscriptorium (Národní knihovna České republiky e altre):
#     API JSON di ricerca dei siti, manifesti IIIF delle biblioteche;
#   - Det Kgl. Bibliotek, Copenaghen (dal 26 ottobre 2026): pagine dei risultati in JSON di Digitale samlinger (Blacklight), immagini IIIF
#     della biblioteca, manifesti scritti dal catalogo (scripts/manifesti.mjs);
#   - Allard Pierson, Universiteit van Amsterdam (dal 26 ottobre 2026): indice del Goobi viewer (una richiesta), manifesti del visore.
# Gli stati sono in data/<fonte>.json. Richieste in serie, una biblioteca dopo l'altra, con le pause di sempre (scripts/rete.mjs).
# Ruota fino a lettura completa: finché una fonte della corsia non ha finito la prima lettura, la corsia lavora fino a circa
# 150 minuti per esecuzione e riparte subito da sola, purché nel giro ci siano stati progressi (scripts/ruota.mjs).
# Poi torna al giro notturno delle 00:50 UTC, che prende i codici nuovi.
name: "Raccolta: corsia europa"

on:
  schedule:
    - cron: "50 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # per la ruota

concurrency:
  group: raccolta-europa
  cancel-in-progress: false

jobs:
  corsia:
    uses: ./.github/workflows/corsia.yml
    with:
      corsia: europa
      fonti: francoforte,dresda,tubinga,darmstadt,handrit,polona,manuscriptorium,kbdk,uva
      argomenti: --hsp-minuti=20 --polona-minuti=40 --manuscriptorium-minuti=50 --kbdk-minuti=20 --uva-minuti=5
      cache: false
      ruota: false
      completa: true
      flusso: raccolta-europa.yml
