# Corsia «papiri» (dal 28 ottobre 2026): papiri che si aprono nel visore di Emendando (verifica in docs/PAPIRI.md). Fonte «papiri»
# (scripts/fonti/papiri.mjs), con le schede di papyri.info (data/papiri-info.json, CC BY 3.0, scritto da scripts/papiri-info.mjs):
#   - Michigan (nessuna richiesta: manifesti dalle schede APIS), Duke (misure delle GIF a 150 dpi, manifesti scritti dal catalogo),
#     Yale (handle -> oggetto con l'API del Handle System), Princeton (schede JSON della mostra, 10 secondi tra le richieste),
#     Vienna (ricerca di ÖNB Digital e manifesti IIIF dell'ÖNB, solo uso non commerciale), Colonia (pagine delle pubblicazioni e degli oggetti,
#     5 secondi tra le richieste, manifesti scritti dal catalogo, CC BY 4.0), Berkeley (OAI-PMH, quando il server risponde).
# Fuori: l'elenco completo di Colonia (/uebersicht, vietato dal robots.txt). Stato in data/papiri.json.
# Ruota fino a lettura completa (manifesti di Vienna, handle di Yale, pagine di Colonia), poi il giro notturno delle 03:40 UTC.
name: "Raccolta: corsia papiri"

on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # per la ruota

concurrency:
  group: raccolta-papiri
  cancel-in-progress: false

jobs:
  corsia:
    uses: ./.github/workflows/corsia.yml
    with:
      corsia: papiri
      fonti: papiri
      argomenti: --papiri-minuti=130
      cache: false
      ruota: false
      completa: true
      flusso: raccolta-papiri.yml
