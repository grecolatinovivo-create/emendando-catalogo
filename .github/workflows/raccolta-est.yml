# Corsia «est» (dal 26 ottobre 2026): biblioteche dell'Europa orientale e della Russia agganciate dopo il censimento di Russia,
# Caucaso, Turchia, Iran e Balcani (docs/COPERTURA.md), server diversi dalle altre corsie:
#   - Biblioteca Nazionale «Santi Cirillo e Metodio», Sofia (fonte «nbkm»): ricerca del sito per collezione, JPEG della biblioteca
#     digitale; i manifesti li scrive il catalogo (scripts/manifesti.mjs);
#   - «Собрание рукописей и старопечатных книг» della Trinità-San Sergio (lib-fond.ru, fonte «libfond»): codici del Reparto
#     manoscritti della Biblioteca Statale Russa e della biblioteca dell'Accademia Teologica di Mosca; pagine dei fondi, schede ed
#     elenchi delle immagini del sito, JPEG di anteprima; i manifesti li scrive il catalogo.
# Gli stati sono in data/<fonte>.json. Richieste in serie, una biblioteca dopo l'altra, con le pause di sempre (lib-fond.ru 2 secondi).
# Ruota fino a lettura completa: finché una fonte della corsia non ha finito la prima lettura, la corsia lavora fino a circa
# 150 minuti per esecuzione e riparte subito da sola, purché nel giro ci siano stati progressi (scripts/ruota.mjs).
# Poi torna al giro notturno delle 02:50 UTC, che prende i codici nuovi.
name: "Raccolta: corsia est"

on:
  schedule:
    - cron: "50 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # per la ruota

concurrency:
  group: raccolta-est
  cancel-in-progress: false

jobs:
  corsia:
    uses: ./.github/workflows/corsia.yml
    with:
      corsia: est
      fonti: nbkm,libfond
      argomenti: --nbkm-minuti=20 --libfond-minuti=120
      cache: false
      ruota: false
      completa: true
      flusso: raccolta-est.yml
