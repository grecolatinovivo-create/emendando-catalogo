# Vecchio nome della raccolta unica (fino al 25 ottobre 2026), ora divisa in corsie parallele: raccolta-vaticana.yml,
# raccolta-yale.yml, raccolta-bodleian.yml, raccolta-giornaliera.yml (vedi il README). Questo file resta solo perché
# l'ultima esecuzione della vecchia raccolta, alla fine, riavvia «raccolta.yml»: qui si passa la mano alla corsia Vaticana.
# Nessun orario: non parte mai da solo. Si può cancellare quando la vecchia raccolta non è più in corso.
name: Raccolta del catalogo (vecchio nome)

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  passa-la-mano:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run raccolta-vaticana.yml --ref main -R "$GITHUB_REPOSITORY" && echo "Avviata la corsia Vaticana"
